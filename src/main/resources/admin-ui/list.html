<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据管理 · 茶文化管理系统</title>
<style>
/* ==========================================================
   通用数据管理页 · 夜茶墨绿金
   用法：list.html?t=shangpinxinxi&n=好茶集市
   列定义由接口返回数据自动推断，覆盖全部管理模块
   ========================================================== */
:root{
  --ink:#08130d; --gold:#D4AF37; --gold-soft:#E6CE9A;
  --gold-line:rgba(212,175,55,.42); --hair:rgba(212,175,55,.15);
  --text:#EDE6D6; --text-2:#93A396; --ok:#7c9b84; --danger:#d98a7c;
  --ease:cubic-bezier(.32,.72,0,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Songti SC","STSong","Source Han Serif SC",Georgia,serif;
  background:var(--ink);color:var(--text);-webkit-font-smoothing:antialiased;
}
.layout{display:grid;grid-template-columns:236px 1fr;min-height:100dvh}

/* 侧栏 */
.side{
  background:linear-gradient(178deg,#102a1e,#0a1810);
  border-right:1px solid var(--hair);padding:30px 20px;
  display:flex;flex-direction:column;gap:6px;
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.seal{
  width:42px;height:42px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(150deg,#a63d2f,#7d2b21);color:#f6f3ec;font-size:22px;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.2),0 10px 24px rgba(0,0,0,.35);
}
.brand b{display:block;font-weight:400;font-size:15px;letter-spacing:2px;color:var(--gold-soft)}
.brand span{font-family:system-ui,sans-serif;font-size:9px;letter-spacing:.22em;color:var(--text-2)}
.nav{
  display:block;padding:10px 14px;border-radius:7px;cursor:pointer;
  color:var(--text-2);font-size:13.5px;letter-spacing:1.5px;text-decoration:none;
  border-left:2px solid transparent;transition:all .5s var(--ease);
}
.nav:hover{background:rgba(212,175,55,.06);color:var(--gold-soft)}
.nav.on{background:rgba(212,175,55,.10);color:var(--gold-soft);border-left-color:var(--gold)}
.side-search{
  margin:4px 0 12px;display:flex;align-items:center;
  border:1px solid var(--hair);border-radius:7px;background:rgba(8,19,13,.5);
}
.side-search input{
  flex:1;height:34px;border:0;outline:0;background:transparent;
  color:var(--text);font-family:inherit;font-size:12.5px;padding:0 11px;
}
.side-search input::placeholder{color:rgba(147,163,150,.5)}
.side-list{overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px}
.side-foot{margin-top:auto;padding-top:18px;border-top:1px solid var(--hair)}
.side-foot a{
  display:block;text-align:center;padding:10px;border-radius:7px;
  border:1px solid var(--hair);color:var(--text-2);text-decoration:none;
  font-size:13px;letter-spacing:2px;transition:all .5s var(--ease);
}
.side-foot a:hover{border-color:var(--gold);color:var(--gold-soft)}

/* 主区 */
.main{padding:32px 38px 56px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:24px;flex-wrap:wrap}
.top h1{font-size:25px;font-weight:400;letter-spacing:4px;color:var(--gold-soft)}
.top p{margin-top:8px;font-family:system-ui,sans-serif;font-size:10.5px;letter-spacing:.26em;color:var(--text-2)}
.tools{display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.tools input{
  width:220px;height:42px;border-radius:7px;border:1px solid var(--hair);
  background:rgba(8,19,13,.6);color:var(--text);font-family:inherit;
  font-size:13.5px;padding:0 14px;outline:0;
  transition:border-color .5s var(--ease),box-shadow .5s var(--ease);
}
.tools input:focus{border-color:rgba(212,175,55,.7);box-shadow:0 0 0 3px rgba(212,175,55,.09)}
.btn{
  padding:11px 20px;border:0;border-radius:7px;cursor:pointer;
  font-family:inherit;font-size:13.5px;letter-spacing:2.5px;color:#10251a;
  background:linear-gradient(160deg,var(--gold-soft),var(--gold));
  box-shadow:0 12px 26px rgba(212,175,55,.18);
  transition:transform .5s var(--ease),box-shadow .5s var(--ease);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 17px 34px rgba(212,175,55,.28)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--gold-soft);border:1px solid var(--hair);box-shadow:none}
.btn.ghost:hover{border-color:var(--gold);background:rgba(212,175,55,.08)}
.btn.mini{padding:7px 13px;font-size:12px;letter-spacing:1.5px;border-radius:5px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(217,138,124,.4);box-shadow:none}
.btn.danger:hover{border-color:var(--danger);background:rgba(217,138,124,.08)}

/* 表格 */
.card{border:1px solid var(--hair);border-radius:13px;overflow:hidden;background:rgba(14,33,24,.55)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{
  text-align:left;padding:14px 16px;font-weight:400;
  font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.13em;
  color:var(--text-2);background:rgba(212,175,55,.055);
  border-bottom:1px solid var(--hair);white-space:nowrap;
}
td{
  padding:13px 16px;font-size:13px;color:var(--text);
  border-bottom:1px solid rgba(212,175,55,.07);vertical-align:middle;
}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .4s var(--ease)}
tbody tr:hover{background:rgba(212,175,55,.045)}
td.img img{width:46px;height:46px;object-fit:cover;border-radius:6px;border:1px solid var(--hair);display:block}
.pill{
  display:inline-block;padding:3px 10px;border-radius:999px;
  font-size:11.5px;letter-spacing:.5px;
  border:1px solid var(--hair);color:var(--gold-soft);background:rgba(212,175,55,.07);
}
.pill.g{color:var(--ok);border-color:rgba(124,155,132,.4);background:rgba(124,155,132,.08)}
.pill.r{color:var(--danger);border-color:rgba(217,138,124,.4);background:rgba(217,138,124,.08)}
.empty{padding:56px 20px;text-align:center;color:var(--text-2);font-size:13.5px;letter-spacing:1.5px}
.pager{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-top:1px solid var(--hair);
  font-size:13px;color:var(--text-2);gap:14px;flex-wrap:wrap;
}
.pager .pages{display:flex;gap:8px;align-items:center}
.pager .pages span{
  min-width:32px;height:32px;line-height:30px;text-align:center;
  border:1px solid var(--hair);border-radius:6px;cursor:pointer;
  padding:0 9px;font-size:13px;transition:all .45s var(--ease);
}
.pager .pages span:hover{border-color:var(--gold);color:var(--gold-soft)}
.pager .pages span.cur{background:rgba(212,175,55,.14);border-color:var(--gold);color:var(--gold-soft)}
.pager .pages span.dis{opacity:.35;cursor:not-allowed}
.loading{padding:44px;text-align:center;color:var(--text-2);font-size:13px;letter-spacing:2px}
.loading i{
  display:inline-block;width:14px;height:14px;margin-right:9px;
  border:2px solid rgba(212,175,55,.25);border-top-color:var(--gold);
  border-radius:50%;vertical-align:-2px;animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* 弹窗 */
.mask{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(4,10,7,.74);backdrop-filter:blur(6px);
}
.mask.on{display:grid;place-items:center;animation:fade .4s var(--ease) both}
.dlg{
  width:min(560px,92vw);max-height:86dvh;overflow-y:auto;
  padding:4px;border-radius:20px;
  background:rgba(255,255,255,.05);border:1px solid var(--hair);
  animation:rise .55s var(--ease) both;
}
.dlg-core{
  border-radius:17px;padding:28px 26px 24px;
  background:linear-gradient(172deg,#132a1e,#0d1e15);
}
.dlg-core h3{font-size:18px;font-weight:400;letter-spacing:3px;color:var(--gold-soft);margin-bottom:20px}
.dlg-core .f{margin-bottom:15px}
.dlg-core .f label{display:block;font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.16em;color:var(--text-2);margin-bottom:7px}
.dlg-core .f input,.dlg-core .f textarea{
  width:100%;border:1px solid var(--hair);border-radius:7px;
  background:rgba(8,19,13,.6);color:var(--text);font-family:inherit;
  font-size:13.5px;padding:10px 13px;outline:0;
  transition:border-color .5s var(--ease);
}
.dlg-core .f input:focus,.dlg-core .f textarea:focus{border-color:rgba(212,175,55,.7)}
.dlg-core .f textarea{min-height:80px;resize:vertical}
.dlg-acts{display:flex;gap:11px;justify-content:flex-end;margin-top:20px}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{flex-direction:column;max-height:none;padding:16px}
  .side-list{display:flex;flex-wrap:wrap;gap:4px;max-height:150px}
  .nav{border-left:0;border-bottom:2px solid transparent;padding:8px 11px;font-size:12.5px}
  .nav.on{border-left:0;border-bottom-color:var(--gold)}
  .side-foot{margin-top:12px}
  .main{padding:22px 16px 44px}
  .top h1{font-size:20px}
  .tools input{width:150px}
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(5px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand">
      <div class="seal">茶</div>
      <div><b>管理控制台</b><span>MANAGE CONSOLE</span></div>
    </div>
    <div class="side-search"><input id="menuSearch" placeholder="搜索模块…" /></div>
    <div class="side-list" id="sideList"></div>
    <div class="side-foot"><a href="./console.html">← 返回仪表盘</a></div>
  </aside>

  <main class="main">
    <div class="top">
      <div>
        <h1 id="title">数据管理</h1>
        <p id="sub">DATA MANAGEMENT</p>
      </div>
      <div class="tools">
        <input id="kw" placeholder="输入关键词检索…" />
        <button class="btn ghost" id="searchBtn">检索</button>
        <button class="btn ghost" id="refreshBtn">刷新</button>
        <button class="btn" id="addBtn">新增</button>
      </div>
    </div>

    <div class="card">
      <div id="body"><div class="loading"><i></i>正在加载…</div></div>
      <div class="pager" id="pager" style="display:none">
        <div id="pageInfo"></div>
        <div class="pages" id="pages"></div>
      </div>
    </div>
  </main>
</div>

<!-- 编辑弹窗 -->
<div class="mask" id="mask">
  <div class="dlg">
    <div class="dlg-core">
      <h3 id="dlgTitle">编辑记录</h3>
      <div id="dlgFields"></div>
      <div class="dlg-acts">
        <button class="btn ghost" id="dlgCancel">取消</button>
        <button class="btn" id="dlgSave">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var API='/springbootj8kskvkr';
  var $=function(id){return document.getElementById(id);};
  var token=localStorage.getItem('Token')||localStorage.getItem('frontToken')||'';
  if(!token){ location.href='./index.html'; return; }

  /* ---------- 模块清单（对应管理端全部功能） ---------- */
  var MODULES=[
    {t:'yonghu',n:'用户管理',g:'账号'},
    {t:'shangjia',n:'茶商管理',g:'账号'},
    {t:'jiaoxueshipin',n:'茶文化管理',g:'内容'},
    {t:'xinlizixun',n:'线上讲座管理',g:'内容'},
    {t:'yuyuezixun',n:'预约讲座管理',g:'内容'},
    {t:'news',n:'购物资讯管理',g:'内容'},
    {t:'newstype',n:'购物资讯分类',g:'内容'},
    {t:'shangpinxinxi',n:'好茶集市管理',g:'商品'},
    {t:'shangpinfenlei',n:'商品分类管理',g:'商品'},
    {t:'cart',n:'购物车',g:'交易'},
    {t:'orders',n:'订单管理',g:'交易'},
    {t:'coupon',n:'优惠券管理',g:'交易'},
    {t:'mycoupon',n:'用户已领优惠券',g:'交易'},
    {t:'address',n:'收货地址',g:'交易'},
    {t:'discussshangpinxinxi',n:'商品评论',g:'互动'},
    {t:'forum',n:'茶友圈',g:'互动'},
    {t:'forumtype',n:'论坛分类管理',g:'互动'},
    {t:'forumreport',n:'举报记录管理',g:'互动'},
    {t:'messages',n:'留言板管理',g:'互动'},
    {t:'storeup',n:'我的收藏管理',g:'互动'},
    {t:'friend',n:'好友关系',g:'互动'},
    {t:'chatmessage',n:'聊天消息',g:'互动'},
    {t:'chargerecord',n:'充值记录',g:'系统'},
    {t:'syslog',n:'系统日志',g:'系统'},
    {t:'config',n:'轮播图管理',g:'系统'}
  ];

  /* ---------- 字段中文名映射（其余字段回退为原名） ---------- */
  var LABELS={
    id:'ID',username:'账号',password:'密码',nickname:'昵称',name:'名称',tel:'电话',phone:'手机',
    email:'邮箱',address:'地址',role:'角色',addtime:'创建时间',
    shangpinmingcheng:'商品名称',shangpinfenlei:'商品分类',shangpinjieshao:'商品介绍',
    shangpintupian:'商品图片',price:'价格',onshelves:'上架',onelimittimes:'单次限购',
    biaoti:'标题',jibenjieshao:'基本介绍',tupian:'图片',shipin:'视频',
    title:'标题',content:'内容',introduction:'简介',img:'封面图',
    zixunmingcheng:'讲座名称',zixunxiangqing:'讲座详情',zixunfengmian:'讲座封面',
    zixunshizhang:'时长',zixunjiage:'价格',kaishishijian:'开始时间',jieshushijian:'结束时间',
    zixunfenlei:'讲座分类',shifoujuban:'是否举办',
    yuyueren:'预约人',yuyueshijian:'预约时间',shuliang:'数量',sfsh:'审核状态',
    ordernumber:'订单号',totalprice:'总金额',status:'状态',shouhuoren:'收货人',
    shouhuodizhi:'收货地址',zhifufangshi:'支付方式',ispay:'是否支付',
    talkcontent:'评论内容',replycontent:'回复内容',userid:'用户ID',nickname2:'昵称',
    storeupnum:'收藏数',clicknum:'点击数',thumbsupnum:'点赞数',crazilynum:'踩数',
    discussionnum:'评论数',totalscore:'总评分',score:'评分',avatarurl:'头像',
    title2:'标题',isdone:'是否处理',reportcontent:'举报内容',reporttype:'举报类型',
    reply:'回复',content2:'内容',typename:'分类名称',
    value:'值',url:'链接',pic:'图片'
  };

  /* ---------- 侧栏 ---------- */
  var qs=new URLSearchParams(location.search);
  var curTable=qs.get('t')||'yonghu';
  var kw='';

  function buildSide(filter){
    var host=$('sideList'), html='', lastG='';
    MODULES.forEach(function(m){
      if(filter && m.n.indexOf(filter)<0 && m.t.indexOf(filter)<0) return;
      if(m.g!==lastG){ lastG=m.g; }
      html+='<a class="nav'+(m.t===curTable?' on':'')+'" href="./list.html?t='+m.t+'&n='+encodeURIComponent(m.n)+'">'+m.n+'</a>';
    });
    host.innerHTML=html||'<div style="padding:14px;color:var(--text-2);font-size:12.5px">没有匹配的模块</div>';
  }
  buildSide('');
  $('menuSearch').addEventListener('input',function(){ buildSide(this.value.trim()); });

  var mod=MODULES.filter(function(m){return m.t===curTable;})[0]||{t:curTable,n:qs.get('n')||'数据管理'};
  $('title').textContent=qs.get('n')||mod.n;
  $('sub').textContent='DATA MANAGEMENT · '+curTable;

  /* ---------- 数据加载 ---------- */
  var page=1,limit=10,total=0,rows=[],cols=[];

  function fmtVal(k,v){
    if(v===null||v===undefined||v==='') return '<span style="color:var(--text-2)">—</span>';
    var s=String(v);
    if(/\.(jpg|jpeg|png|gif|webp)$/i.test(s) || /^(upload|http).*(jpg|jpeg|png|gif|webp)$/i.test(s)){
      var src = /^http/i.test(s) ? s : API+'/'+s.replace(/^\/+/,'');
      return '<div class="img"><img src="'+src+'" loading="lazy" /></div>';
    }
    if(s.length>42) s=s.slice(0,42)+'…';
    return '<span title="'+String(v).replace(/"/g,'&quot;')+'">'+s+'</span>';
  }

  function isImg(v){ return v && typeof v==='string' && /\.(jpg|jpeg|png|gif|webp)$/i.test(v); }

  function render(){
    var host=$('body');
    if(!rows.length){ host.innerHTML='<div class="empty">暂无数据</div>'; $('pager').style.display='none'; return; }

    /* 列：取第一条记录前若干字段，跳过长文本与敏感字段 */
    var skip={password:1};
    cols=Object.keys(rows[0]).filter(function(k){ return !skip[k]; }).slice(0,9);

    var h='<div class="tbl-wrap"><table><thead><tr>';
    cols.forEach(function(c){ h+='<th>'+(LABELS[c]||c)+'</th>'; });
    h+='<th>操作</th></tr></thead><tbody>';
    rows.forEach(function(r){
      h+='<tr>';
      cols.forEach(function(c){ h+='<td class="'+(isImg(r[c])?'img':'')+'">'+fmtVal(c,r[c])+'</td>'; });
      h+='<td><button class="btn ghost mini" data-edit="'+r.id+'">编辑</button> '+
         '<button class="btn danger mini" data-del="'+r.id+'">删除</button></td>';
      h+='</tr>';
    });
    h+='</tbody></table></div>';
    host.innerHTML=h;

    /* 分页 */
    var pages=Math.max(1,Math.ceil(total/limit));
    $('pager').style.display='flex';
    $('pageInfo').textContent='共 '+total+' 条 · 第 '+page+' / '+pages+' 页';
    var ph='<span class="'+(page<=1?'dis':'')+'" data-p="'+(page-1)+'">上一页</span>';
    var from=Math.max(1,page-2), to=Math.min(pages,from+4);
    from=Math.max(1,to-4);
    for(var i=from;i<=to;i++) ph+='<span class="'+(i===page?'cur':'')+'" data-p="'+i+'">'+i+'</span>';
    ph+='<span class="'+(page>=pages?'dis':'')+'" data-p="'+(page+1)+'">下一页</span>';
    $('pages').innerHTML=ph;
  }

  function load(){
    $('body').innerHTML='<div class="loading"><i></i>正在加载…</div>';
    var url=API+'/'+curTable+'/page?page='+page+'&limit='+limit+'&sort=id&order=desc';
    if(kw) url+='&keyword='+encodeURIComponent(kw);
    fetch(url,{headers:{'Token':token}}).then(function(r){return r.json();}).then(function(res){
      if(!res||res.code!==0){
        $('body').innerHTML='<div class="empty">加载失败：'+((res&&res.msg)||'接口无响应')+'</div>';
        $('pager').style.display='none'; return;
      }
      var d=res.data||{};
      rows=d.list||d.records||[];
      total=d.total||rows.length;
      render();
    }).catch(function(){
      $('body').innerHTML='<div class="empty">无法连接服务，请确认后端已启动</div>';
      $('pager').style.display='none';
    });
  }

  $('pages').addEventListener('click',function(e){
    var t=e.target.getAttribute('data-p');
    if(!t) return;
    var p=parseInt(t,10);
    if(p<1||p===page) return;
    page=p; load();
  });
  $('refreshBtn').addEventListener('click',load);
  $('searchBtn').addEventListener('click',function(){ kw=$('kw').value.trim(); page=1; load(); });
  $('kw').addEventListener('keydown',function(e){ if(e.key==='Enter'){ kw=this.value.trim(); page=1; load(); } });

  /* ---------- 编辑 / 新增 ---------- */
  var editing=null;

  function openDlg(row){
    editing=row||null;
    $('dlgTitle').textContent=row?('编辑 · '+(LABELS[cols[0]]||cols[0])):'新增记录';
    var fields=cols.length?cols:['name'];
    if(!row){ fields=['name','tel','username','password','email','address']; }
    var h='';
    fields.forEach(function(c){
      if(c==='id'||c==='addtime') return;
      var v=row?(row[c]==null?'':row[c]):'';
      var long=String(v).length>60;
      h+='<div class="f"><label>'+(LABELS[c]||c)+'</label>'+
        (long?'<textarea data-k="'+c+'">'+v+'</textarea>':'<input data-k="'+c+'" value="'+String(v).replace(/"/g,'&quot;')+'" />')+
        '</div>';
    });
    $('dlgFields').innerHTML=h||'<div class="f"><label>名称</label><input data-k="name" /></div>';
    $('mask').classList.add('on');
  }
  function closeDlg(){ $('mask').classList.remove('on'); editing=null; }

  function collect(){
    var o={};
    $('dlgFields').querySelectorAll('[data-k]').forEach(function(el){
      var k=el.getAttribute('data-k');
      var v=el.value;
      if(v!=='') o[k]=v;
    });
    if(editing) o.id=editing.id;
    return o;
  }

  function save(){
    var payload=collect();
    var isEdit=!!editing;
    var url=API+'/'+curTable+'/'+(isEdit?'update':'save');
    $('dlgSave').disabled=true;
    fetch(url,{
      method:'POST',
      headers:{'Content-Type':'application/json; charset=utf-8','Token':token},
      body:JSON.stringify(payload)
    }).then(function(r){return r.json();}).then(function(res){
      $('dlgSave').disabled=false;
      if(res&&res.code===0){ closeDlg(); load(); }
      else { alert((res&&res.msg)||'保存失败'); }
    }).catch(function(){ $('dlgSave').disabled=false; alert('请求失败'); });
  }

  function del(id){
    if(!confirm('确认删除这条记录？此操作不可撤销。')) return;
    fetch(API+'/'+curTable+'/delete',{
      method:'POST',
      headers:{'Content-Type':'application/json; charset=utf-8','Token':token},
      body:JSON.stringify([id])
    }).then(function(r){return r.json();}).then(function(res){
      if(res&&res.code===0) load(); else alert((res&&res.msg)||'删除失败');
    }).catch(function(){ alert('请求失败'); });
  }

  $('body').addEventListener('click',function(e){
    var ed=e.target.getAttribute('data-edit'), dl=e.target.getAttribute('data-del');
    if(ed!=null){
      var row=rows.filter(function(r){return String(r.id)===String(ed);})[0];
      if(row) openDlg(row);
    }
    if(dl!=null) del(dl);
  });
  $('addBtn').addEventListener('click',function(){ openDlg(null); });
  $('dlgCancel').addEventListener('click',closeDlg);
  $('dlgSave').addEventListener('click',save);
  $('mask').addEventListener('click',function(e){ if(e.target===this) closeDlg(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeDlg(); });

  load();
})();
</script>
</body>
</html>
