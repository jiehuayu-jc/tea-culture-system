<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.ico">
<title>茶文化管理系统 · 管理控制台</title>
<style>
/* ==========================================================
   管理端登录页 · 夜茶墨绿金
   左：实拍茶席图 + 品牌叙事 + 竖排题字
   右：深绿毛玻璃面板 + 登录表单
   纯手写，不依赖构建产物
   ========================================================== */
@font-face{
  font-family:'TeaSerif';
  src:url('../front/fonts/SourceHanSerifCN-Heavy-subset.2022211a.woff2') format('woff2');
  font-display:swap;
}
:root{
  --gold:#D4AF37; --gold-soft:#E6CE9A; --gold-line:rgba(212,175,55,.42);
  --text:#EDE6D6; --text-2:#93A396; --danger:#d98a7c; --ok:#7c9b84;
  --ease:cubic-bezier(.32,.72,0,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'TeaSerif','Noto Serif SC','Source Han Serif SC','Songti SC','STSong','SimSun',Georgia,serif;
  background:#08130d; color:var(--text); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(212,175,55,.3)}
:focus-visible{outline:2px solid rgba(212,175,55,.55);outline-offset:2px;border-radius:4px}
/* ---------- 舞台：左实拍 + 右面板 ---------- */
.stage{display:grid;grid-template-columns:1.62fr 1fr;min-height:100dvh}

/* ---------- 左：实拍茶席 ---------- */
.visual{
  position:relative;overflow:hidden;
  animation:fadeIn 1.4s var(--ease) both;
}
.visual-img{
  position:absolute;inset:0;
  background:url("./img/login-bg.png") center/cover no-repeat;
  transform:scale(1.06);
  animation:slowZoom 18s var(--ease) forwards;
}
/* 左侧压暗，保证文字可读；右侧向右渐深，与右面板无缝衔接 */
.visual::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(100deg, rgba(8,19,13,.90) 0%, rgba(8,19,13,.66) 42%, rgba(8,19,13,.42) 68%, rgba(10,24,16,.96) 100%),
    radial-gradient(720px 460px at 18% 78%, rgba(62,107,79,.34), transparent 66%);
}
.visual-inner{
  position:relative;z-index:2;height:100%;
  padding:62px 58px;
  display:flex;flex-direction:column;justify-content:space-between;
}
.badge{
  display:inline-block;padding:6px 15px;
  background:linear-gradient(150deg,#a63d2f,#7d2b21);
  color:#f6f3ec;font-size:13px;letter-spacing:3px;
  border-radius:3px;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.2), 0 10px 26px rgba(0,0,0,.36);
}
.en{
  margin-top:26px;font-family:system-ui,sans-serif;
  font-size:11px;letter-spacing:.42em;color:rgba(230,206,154,.72);
}
.slogan{
  margin-top:20px;font-size:20px;letter-spacing:8px;
  color:var(--gold-soft);
  text-shadow:0 2px 18px rgba(0,0,0,.6);
}
.visual-foot{
  font-size:12px;letter-spacing:2.5px;
  color:rgba(147,163,150,.66);line-height:2;
}
/* 竖排题字 */
.vtext{
  position:absolute;z-index:3;
  top:50%;right:44px;transform:translateY(-50%);
  writing-mode:vertical-rl;
  font-size:19px;letter-spacing:13px;
  color:rgba(230,206,154,.62);
  text-shadow:0 2px 16px rgba(0,0,0,.7);
  animation:riseIn 1.2s var(--ease) .3s both;
}
.vtext::before{
  content:"";position:absolute;top:-64px;left:50%;
  width:1px;height:44px;background:linear-gradient(180deg,transparent,var(--gold-line));
}

/* ---------- 右：登录面板 ---------- */
.panel{
  position:relative;z-index:4;
  background:linear-gradient(172deg, rgba(19,42,30,.97), rgba(11,25,17,.99));
  border-left:1px solid rgba(212,175,55,.16);
  display:flex;align-items:center;
  padding:48px 62px;
  box-shadow:-30px 0 70px rgba(0,0,0,.5);
}
.form{width:100%;max-width:392px;margin:0 auto}
.form h1{
  font-size:30px;font-weight:400;letter-spacing:4px;
  color:var(--gold-soft);
  animation:riseIn .9s var(--ease) .12s both;
}
.form .sub{
  margin-top:11px;font-family:system-ui,sans-serif;
  font-size:10.5px;letter-spacing:.34em;color:var(--text-2);
  animation:riseIn .9s var(--ease) .18s both;
}
.rule{
  margin:26px 0 30px;height:1px;width:100%;
  background:linear-gradient(90deg,var(--gold-line),transparent 72%);
  animation:riseIn .9s var(--ease) .22s both;
}
.field{margin-bottom:20px;animation:riseIn .9s var(--ease) both}
.field:nth-of-type(1){animation-delay:.26s}
.field:nth-of-type(2){animation-delay:.32s}
.field label{
  display:block;font-family:system-ui,sans-serif;
  font-size:11px;letter-spacing:.2em;color:var(--text-2);margin-bottom:10px;
}
.box{
  display:flex;align-items:center;
  border:1px solid rgba(212,175,55,.22);border-radius:6px;
  background:rgba(8,19,13,.55);
  transition:border-color .5s var(--ease),box-shadow .5s var(--ease),background .5s var(--ease);
}
.box:focus-within{
  border-color:rgba(212,175,55,.72);
  background:rgba(8,19,13,.78);
  box-shadow:0 0 0 3px rgba(212,175,55,.09);
}
.box input{
  flex:1;height:48px;border:0;outline:0;background:transparent;
  color:var(--text);font-size:14.5px;letter-spacing:1px;
  padding:0 15px;font-family:inherit;
}
.box input::placeholder{color:rgba(147,163,150,.5)}
.eye{
  width:44px;height:48px;display:grid;place-items:center;
  cursor:pointer;color:var(--text-2);font-size:15px;
  transition:color .4s var(--ease);user-select:none;
}
.eye:hover,.eye.on{color:var(--gold-soft)}
/* 主按钮 */
.btn{
  width:100%;height:50px;margin-top:8px;border:0;cursor:pointer;
  border-radius:6px;
  font-family:inherit;font-size:16px;letter-spacing:8px;text-indent:8px;
  color:#10251a;
  background:linear-gradient(160deg,var(--gold-soft),var(--gold));
  box-shadow:0 14px 34px rgba(212,175,55,.20);
  transition:transform .55s var(--ease),box-shadow .55s var(--ease),filter .55s var(--ease);
  animation:riseIn .9s var(--ease) .38s both;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 20px 46px rgba(212,175,55,.32)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.aux{
  margin-top:18px;text-align:right;font-size:13px;
  color:var(--text-2);letter-spacing:1px;
  animation:riseIn .9s var(--ease) .42s both;
}
.aux a{color:var(--gold-soft);text-decoration:none;transition:opacity .4s var(--ease)}
.aux a:hover{opacity:.75}
/* 演示账号一键填充 */
.demo{
  margin-top:30px;padding-top:22px;
  border-top:1px dashed rgba(212,175,55,.16);
  font-size:12px;color:var(--text-2);letter-spacing:1px;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  animation:riseIn .9s var(--ease) .48s both;
}
.demo i{font-style:normal;margin-right:2px}
.tag{
  padding:6px 14px;border-radius:4px;cursor:pointer;
  border:1px solid rgba(212,175,55,.26);
  color:var(--gold-soft);font-size:12px;letter-spacing:2px;
  transition:all .45s var(--ease);
}
.tag:hover{border-color:var(--gold);background:rgba(212,175,55,.12);color:#f6f3ec}
.msg{
  margin-top:18px;min-height:18px;font-size:12.5px;
  letter-spacing:1px;color:var(--danger);
}
.msg.ok{color:var(--ok)}

@media (max-width:960px){
  .stage{grid-template-columns:1fr}
  .visual{min-height:290px}
  .visual-inner{padding:38px 26px}
  .slogan{font-size:16px;letter-spacing:5px}
  .vtext{display:none}
  .panel{padding:40px 26px 56px;border-left:0;border-top:1px solid rgba(212,175,55,.16)}
  .form h1{font-size:25px}
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slowZoom{from{transform:scale(1.06)}to{transform:scale(1)}}
@keyframes riseIn{
  from{opacity:0;transform:translateY(20px);filter:blur(5px)}
  to{opacity:1;transform:translateY(0);filter:blur(0)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="stage">
  <!-- 左：实拍茶席 -->
  <section class="visual">
    <div class="visual-img"></div>
    <div class="visual-inner">
      <div>
        <span class="badge">陆羽茶经</span>
        <p class="en">CHINESE TEA CULTURE</p>
        <p class="slogan">六大茶类 · 源头直采 · 以盏见心</p>
      </div>
      <div class="visual-foot">
        茶文化管理系统 · MANAGE CONSOLE<br />以盏见心 · 以数据治茶事
      </div>
    </div>
    <div class="vtext">茶之为饮 发乎神农</div>
  </section>

  <!-- 右：登录面板 -->
  <aside class="panel">
    <form class="form" id="form" autocomplete="on">
      <h1>茶文化管理系统</h1>
      <p class="sub">TEA CULTURE · 用户登录</p>
      <div class="rule"></div>

      <div class="field">
        <label>账 号</label>
        <div class="box">
          <input id="u" placeholder="请输入账号" autocomplete="username" />
        </div>
      </div>

      <div class="field">
        <label>密 码</label>
        <div class="box">
          <input id="p" type="password" placeholder="请输入密码" autocomplete="current-password" />
          <span class="eye" id="eye" title="显示密码">◉</span>
        </div>
      </div>

      <button class="btn" id="submit" type="submit">登 录</button>

      <div class="aux">
        还没有账号？<a href="../front/index.html#/register">注册用户 →</a>
      </div>

      <div class="demo">
        <i>演示账号</i>
        <span class="tag" data-u="admin" data-p="admin">管理员 admin / admin</span>
        <span style="color:var(--text-3)">用户与茶商请从前台登录（前台账号：用户账号1 / 商家账号1，密码 123456）</span>
      </div>

      <div class="msg" id="msg"></div>
    </form>
  </aside>
</div>

<script>
(function(){
  var API = '/springbootj8kskvkr';
  var $ = function(id){ return document.getElementById(id); };

  /* 密码可见切换 */
  var eye = $('eye'), pw = $('p');
  eye.addEventListener('click', function(){
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eye.classList.toggle('on', show);
    eye.textContent = show ? '◎' : '◉';
    eye.title = show ? '隐藏密码' : '显示密码';
  });

  /* 演示账号一键填充 */
  document.querySelectorAll('.tag').forEach(function(tag){
    tag.addEventListener('click', function(){
      $('u').value = tag.getAttribute('data-u');
      $('p').value = tag.getAttribute('data-p');
      say('已填入「' + tag.textContent + '」账号', true);
      $('submit').focus();
    });
  });

  function say(text, ok){
    var m = $('msg');
    m.textContent = text || '';
    m.className = 'msg' + (ok ? ' ok' : '');
  }

  function login(e){
    if(e) e.preventDefault();
    var u = $('u').value.trim(), p = $('p').value.trim();
    if(!u || !p){ say('请填写账号与密码'); return; }
    var btn = $('submit');
    btn.disabled = true; say('正在验证…', true);

    fetch(API + '/users/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'username=' + encodeURIComponent(u) + '&password=' + encodeURIComponent(p)
    }).then(function(r){ return r.json(); }).then(function(res){
      btn.disabled = false;
      if(res && res.code === 0 && res.token){
        /* 同时写入两套 key，兼容既有页面读取习惯 */
        localStorage.setItem('frontToken', res.token);
        localStorage.setItem('Token', res.token);
        try{
          localStorage.setItem('frontUser', JSON.stringify(res.data || {}));
          localStorage.setItem('userid', (res.data && res.data.id) ? res.data.id : '');
          localStorage.setItem('role', (res.data && res.data.role) ? res.data.role : '');
        }catch(err){}
        say('登录成功，正在进入…', true);
        setTimeout(function(){ location.href = './console.html'; }, 400);
      } else {
        say((res && res.msg) ? res.msg : '账号或密码有误');
      }
    }).catch(function(){
      btn.disabled = false;
      say('无法连接服务，请确认后端已启动');
    });
  }

  $('form').addEventListener('submit', login);
  $('u').focus();
})();
</script>
</body>
</html>
