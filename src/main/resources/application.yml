# Tomcat
server:
    tomcat:
        uri-encoding: UTF-8
    port: 8080
    servlet:
        context-path: /springbootj8kskvkr


spring:
    datasource:
        driverClassName: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://127.0.0.1:3306/springbootj8kskvkr?useUnicode=true&characterEncoding=utf-8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true
        username: root
        password: 123456

#        driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
#        url: jdbc:sqlserver://127.0.0.1:1433;DatabaseName=springbootj8kskvkr
#        username: sa
#        password: 123456

    servlet:
      multipart:
        max-file-size: 300MB
        max-request-size: 300MB
    resources:
      static-locations: classpath:static/,file:static/

#mybatis
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.entity
  global-config:
    #主键类型  0:"数据库ID自增", 1:"用户输入ID",2:"全局唯一ID (数字类型唯一ID)", 3:"全局唯一ID UUID";
    id-type: 1
    #字段策略 0:"忽略判断",1:"非 NULL 判断"),2:"非空判断"
    field-strategy: 1
    #驼峰下划线转换
    db-column-underline: true
    #刷新mapper 调试神器
    refresh-mapper: true
    #逻辑删除配置
    logic-delete-value: -1
    logic-not-delete-value: 0
    #自定义SQL注入器
    sql-injector: com.baomidou.mybatisplus.mapper.LogicSqlInjector
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    #springboot 项目mybatis plus 设置 jdbcTypeForNull (oracle数据库需配置JdbcType.NULL, 默认是Other)
    jdbc-type-for-null: 'null' 

# AI 大模型配置（DeepSeek，OpenAI 兼容协议）
# api-key 不写入版本库。两种注入方式（任选其一，后者优先级更高）：
#   1) 环境变量 DEEPSEEK_API_KEY
#   2) 项目根目录 config/application.yml（已被 .gitignore 排除），模板见 config/application.yml.example
# 两者都未配置时，系统自动进入"离线演示模式"
ai:
    deepseek:
        api-key: "${DEEPSEEK_API_KEY:}"
        base-url: "https://api.deepseek.com"
        model: "deepseek-chat"
    # 稠密向量通道（可选）。配置后 RAG 的召回层自动升级为「BM25 稀疏 + 向量稠密」
    # 双路并做 RRF 融合；未配置或调用失败时静默降级为单路 BM25，链路不中断。
    # Key 注入方式同 DeepSeek：环境变量 DASHSCOPE_API_KEY，或 config/application.yml
    embedding:
        api-key: "${DASHSCOPE_API_KEY:}"
        base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
        model: "text-embedding-v3"
    # 接口配额：per-IP 滑动窗口限流（命中返回 429，不计入大模型调用）
    rate-limit:
        minute: 10
        day: 200
